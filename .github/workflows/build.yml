name: Build and publish ChestCounterFortnite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Read app version
        id: app_version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -Raw src/ChestCounter/ChestCounter.csproj
          $version = $project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Version missing from ChestCounter.csproj' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Publish app
        run: dotnet publish src/ChestCounter/ChestCounter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:Version=${{ steps.app_version.outputs.version }} -o dist
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-installer | Out-Null
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source }
          if (-not $iscc) { throw 'ISCC.exe not found after installing Inno Setup' }
          & $iscc "/DAppVersion=${{ steps.app_version.outputs.version }}" "installer\ChestCounter.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checksums
        shell: pwsh
        run: |
          $files = @('dist/ChestCounterFortnite.exe', 'dist-installer/ChestCounterFortnite-Setup.exe')
          foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))" | Set-Content -Encoding ascii "$file.sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ChestCounterFortnite
          path: |
            dist/ChestCounterFortnite.exe
            dist/ChestCounterFortnite.exe.sha256
            dist-installer/ChestCounterFortnite-Setup.exe
            dist-installer/ChestCounterFortnite-Setup.exe.sha256
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: ChestCounterFortnite ${{ steps.app_version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            dist-installer/ChestCounterFortnite-Setup.exe
            dist-installer/ChestCounterFortnite-Setup.exe.sha256
            dist/ChestCounterFortnite.exe
            dist/ChestCounterFortnite.exe.sha256
          make_latest: true
